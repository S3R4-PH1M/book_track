<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book Tracker Admin</title>
<style>
  :root { --line: #ddd; --muted: #666; --accent: #2f6fde; --error: #b00020; --ok: #1b7f3b; --star: #e8b923; }
  body { font-family: system-ui, -apple-system, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; color: #111; }
  h1 { margin-bottom: 4px; }
  label { display: block; margin-top: 8px; font-size: 13px; }
  input, select, textarea { width: 100%; padding: 6px; margin-top: 2px; box-sizing: border-box; font: inherit; font-size: 14px; }
  input:disabled { background: #f3f3f3; color: #444; }
  button { margin-top: 12px; padding: 8px 14px; cursor: pointer; font: inherit; font-size: 14px; }
  button:disabled { cursor: progress; opacity: 0.6; }
  .row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .row > * { flex: 1 1 140px; }
  .row > .shrink { flex: 0 0 auto; }
  .hint { color: var(--muted); font-size: 12px; }
  .error { color: var(--error); font-size: 13px; }
  .message { color: var(--ok); font-size: 13px; }
  .notice { background: #fff7e0; border: 1px solid #f0d58a; padding: 8px 10px; font-size: 13px; margin-top: 8px; }
  .notice button { margin: 0 0 0 8px; padding: 4px 10px; }
  [hidden] { display: none !important; }
  #app { display: none; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .topbar button { margin: 0; }

  /* Form */
  #book-form { border: 1px solid var(--line); padding: 4px 16px 16px; border-radius: 6px; }
  #book-form.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { box-shadow: 0 0 0 4px rgba(47, 111, 222, 0.5); } to { box-shadow: 0 0 0 0 rgba(47, 111, 222, 0); } }
  @media (prefers-reduced-motion: reduce) { #book-form.flash { animation: none; outline: 3px solid var(--accent); } }
  details { margin-top: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; }
  summary { cursor: pointer; font-size: 13px; }
  fieldset { border: 0; padding: 0; margin: 12px 0 0; }
  legend { font-size: 13px; padding: 0; }

  .preview { display: flex; gap: 12px; margin-top: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: #fafafa; }
  .preview img, .cover-placeholder { width: 56px; height: 84px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--line); background: #eee; }
  .preview .title { font-weight: 600; }
  .preview div { font-size: 13px; }

  /* Star rating: radios in reverse order so CSS can colour a star and the ones before it. */
  .stars { display: inline-flex; flex-direction: row-reverse; justify-content: flex-end; gap: 2px; }
  .stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .stars label { margin: 0; font-size: 26px; line-height: 1; color: #ccc; cursor: pointer; }
  .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: var(--star); }
  .stars input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 2px; }
  .rating-row { display: flex; align-items: center; gap: 12px; }
  .rating-row button { margin: 0; padding: 4px 10px; font-size: 12px; }

  /* Book list */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filters input[type="search"] { flex: 1 1 220px; width: auto; }
  .filters select { width: auto; }
  .filters label { display: flex; align-items: center; gap: 4px; margin: 0; }
  .filters input[type="checkbox"] { width: auto; margin: 0; }
  .filters button { margin: 0; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { border-bottom: 1px solid var(--line); padding: 8px 6px; font-size: 13px; text-align: left; vertical-align: top; }
  td.cover img, td.cover .cover-placeholder { width: 40px; height: 60px; }
  .book-title { font-weight: 600; }
  .book-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: #eee; margin-left: 4px; }
  .badge.warn { background: #fff0c2; }
  tr.archived { opacity: 0.6; }
  td.actions button { margin: 0 4px 4px 0; padding: 4px 8px; font-size: 12px; }
  .rating-cell { color: var(--star); white-space: nowrap; }
  .rating-cell.unrated { color: var(--muted); }
</style>
</head>
<body>
  <h1>Book Tracker Admin</h1>
  <p class="hint">This page is for managing book entries only — keep it private, don't embed it anywhere.</p>

  <section id="login">
    <h2>Sign in</h2>
    <form id="login-form">
      <label>Email <input id="email" type="email" autocomplete="username" required /></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
      <button id="login-btn" type="submit">Sign in</button>
      <p class="error" id="login-error" role="alert"></p>
    </form>
  </section>

  <section id="app">
    <div class="topbar">
      <span class="hint">Signed in as <strong id="user-email"></strong></span>
      <button id="logout-btn" type="button">Sign out</button>
    </div>

    <h2 id="form-heading">Add a book</h2>
    <form id="book-form" novalidate>
      <div class="row">
        <label>ISBN (10 or 13 digits, hyphens OK)
          <input id="isbn" autocomplete="off" inputmode="numeric" />
        </label>
        <button type="button" id="lookup-btn" class="shrink">Look up</button>
      </div>
      <div class="hint" id="lookup-status" aria-live="polite"></div>
      <div id="duplicate-notice" class="notice" hidden></div>
      <div id="preview" class="preview" hidden></div>

      <details id="details">
        <summary>Book details <span class="hint">(filled in from Open Library — edit to override)</span></summary>
        <label>Title <input id="title" /></label>
        <label>Subtitle <input id="subtitle" /></label>
        <label>Authors <span class="hint">(comma-separated)</span> <input id="authors" /></label>
        <label>Cover image URL <span class="hint">(https only)</span> <input id="cover_url" type="url" /></label>
        <div class="row">
          <label>Publisher <input id="publisher" /></label>
          <label>Year published <input id="published_year" type="number" min="0" max="2200" /></label>
        </div>
      </details>

      <div class="row">
        <label>Status
          <select id="status">
            <option value="want_to_read">Want to read</option>
            <option value="reading" selected>Reading</option>
            <option value="paused">Paused</option>
            <option value="finished">Finished</option>
            <option value="abandoned">Abandoned</option>
          </select>
        </label>
        <label>Format
          <select id="format">
            <option value="">—</option>
            <option value="physical">Physical</option>
            <option value="ebook">Ebook</option>
            <option value="audiobook">Audiobook</option>
          </select>
        </label>
      </div>

      <div id="progress-fields">
        <div class="row">
          <label>Current page <input id="current_page" type="number" min="0" /></label>
          <label>Total pages <input id="total_pages" type="number" min="0" /></label>
          <label>Progress % <span class="hint" id="progress-hint"></span>
            <input id="progress_percent" type="number" min="0" max="100" value="0" />
          </label>
        </div>
      </div>

      <div class="row" id="date-fields">
        <label id="started-field">Started <input id="started_on" type="date" /></label>
        <label id="finished-field">Finished <input id="finished_on" type="date" /></label>
      </div>

      <fieldset>
        <legend>Rating</legend>
        <div class="rating-row">
          <div class="stars" id="stars">
            <input type="radio" name="rating" id="rating-5" value="5" /><label for="rating-5" title="5 stars" aria-label="5 stars">★</label>
            <input type="radio" name="rating" id="rating-4" value="4" /><label for="rating-4" title="4 stars" aria-label="4 stars">★</label>
            <input type="radio" name="rating" id="rating-3" value="3" /><label for="rating-3" title="3 stars" aria-label="3 stars">★</label>
            <input type="radio" name="rating" id="rating-2" value="2" /><label for="rating-2" title="2 stars" aria-label="2 stars">★</label>
            <input type="radio" name="rating" id="rating-1" value="1" /><label for="rating-1" title="1 star" aria-label="1 star">★</label>
          </div>
          <span class="hint" id="rating-text">Not rated</span>
          <button type="button" id="clear-rating">Clear</button>
        </div>
      </fieldset>

      <label>Tags <span class="hint">(comma-separated)</span> <input id="tags" /></label>
      <label>Notes <span class="hint">(private — not shown in the widget)</span> <textarea id="notes" rows="3"></textarea></label>
      <label>Sort order <span class="hint">(lower shows first in the widget)</span> <input id="sort_order" type="number" value="0" /></label>

      <button type="submit" id="save-btn">Add book</button>
      <button type="button" id="cancel-edit">Clear form</button>
      <p class="error" id="form-error" role="alert"></p>
      <p class="message" id="form-message" role="status"></p>
    </form>

    <h2>Books</h2>
    <div class="filters">
      <input type="search" id="search" placeholder="Search title, author, ISBN, tag…" aria-label="Search books" />
      <select id="status-filter" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="want_to_read">Want to read</option>
        <option value="reading">Reading</option>
        <option value="paused">Paused</option>
        <option value="finished">Finished</option>
        <option value="abandoned">Abandoned</option>
      </select>
      <label><input type="checkbox" id="show-archived" /> Show archived</label>
      <button type="button" id="refresh-missing" title="Look up every book that has no title or cover">Fill in missing details</button>
    </div>
    <p class="hint" id="list-summary" aria-live="polite"></p>
    <table>
      <thead>
        <tr><th></th><th>Book</th><th>Status</th><th>Progress</th><th>Rating</th><th></th></tr>
      </thead>
      <tbody id="book-rows"></tbody>
    </table>
  </section>

  <!-- Pinned to an exact version with Subresource Integrity: if the CDN ever serves different
       bytes, the browser refuses to run it. Uses the published (already minified) supabase.js,
       not jsDelivr's auto-generated .min.js, so the hash matches the npm package byte-for-byte.
       When upgrading, update both the version and the hash. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
          integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
          crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
