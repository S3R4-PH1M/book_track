<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Tracker Widget Demo</title>
</head>
<body>
  <h1>Book Tracker Widget Demo</h1>
  <p>Reads your Supabase project URL and publishable key from <code>../config.js</code>
    (copy <code>config.example.js</code> to create it — see ../README.md).</p>

  <div id="widget-slot"></div>

  <script src="../config.js"></script>
  <script src="book-tracker-widget.js"></script>
  <script>
    // On a real site you'd write the attributes directly in the <book-tracker-widget> tag - Use only for testing widget
    const config = window.BOOK_TRACKER_CONFIG || {};
    const widget = document.createElement('book-tracker-widget');
    widget.setAttribute('project-url', config.supabaseUrl || '');
    widget.setAttribute('anon-key', config.supabaseKey || '');
    widget.setAttribute('limit', '20');
    document.getElementById('widget-slot').append(widget);
  </script>
</body>
</html>
